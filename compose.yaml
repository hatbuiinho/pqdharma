services:
  postgres:
    container_name: pq-dharma-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dharma
      POSTGRES_USER: dharma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dharma_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dharma -d dharma"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    container_name: pq-dharma-api
    build: ./be
    environment:
      DATABASE_URL: postgres://dharma:${POSTGRES_PASSWORD:-dharma_local}@pq-dharma-postgres:5432/dharma?sslmode=disable
      UPLOAD_DIR: /uploads
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-pqdharma}
      S3_PREFIX: ${S3_PREFIX:-prod}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
    volumes:
      - ./imports/aaaS89avDVU:/data:ro
      - audio_uploads:/uploads
    command: ["./server", "-sample", "/data/import.json", "-ipa-voice", "${IPA_VOICE:-en-gb}", "-ipa-overrides", "/data/phonetic-overrides.json"]
    depends_on:
      postgres:
        condition: service_healthy
  transcriber:
    container_name: pq-dharma-transcriber
    build: ./transcriber
    environment:
      DATABASE_URL: postgres://dharma:${POSTGRES_PASSWORD:-dharma_local}@pq-dharma-postgres:5432/dharma?sslmode=disable
      UPLOAD_DIR: /uploads
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-pqdharma}
      S3_PREFIX: ${S3_PREFIX:-prod}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      WHISPER_MODEL: ${WHISPER_MODEL:-small.en}
      CPU_THREADS: ${CPU_THREADS:-2}
    volumes:
      - audio_uploads:/uploads
      - speech_models:/models
      - ./imports/aaaS89avDVU:/sample:ro
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
  web:
    container_name: pq-dharma-web
    build: ./fe
    environment:
      API_ORIGIN: http://pq-dharma-api:8080
    ports:
      - "3000:3000"
    depends_on:
      - api
volumes:
  postgres_data:
  audio_uploads:
  speech_models:
