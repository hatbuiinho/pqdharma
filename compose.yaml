services:
  api:
    container_name: pq-dharma-api
    build: ./be
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      UPLOAD_DIR: /uploads
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-pqdharma}
      S3_PREFIX: ${S3_PREFIX:-prod}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
    volumes:
      - ./imports/aaaS89avDVU:/data:ro
      - audio_uploads:/uploads
    command: ["./server", "-sample", "/data/import.json", "-ipa-voice", "${IPA_VOICE:-en-gb}", "-ipa-overrides", "${IPA_OVERRIDES:-}"]
    restart: unless-stopped
    networks: [nginx_network]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
  transcriber:
    container_name: pq-dharma-transcriber
    build: ./transcriber
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      UPLOAD_DIR: /uploads
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-pqdharma}
      S3_PREFIX: ${S3_PREFIX:-prod}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      WHISPER_MODEL: ${WHISPER_MODEL:-small.en}
      CPU_THREADS: ${CPU_THREADS:-2}
    volumes:
      - audio_uploads:/uploads
      - speech_models:/models
      - ./imports/aaaS89avDVU:/sample:ro
    restart: unless-stopped
    networks: [nginx_network]
    cpus: "${TRANSCRIBER_CPUS:-2}"
    mem_limit: ${TRANSCRIBER_MEMORY:-4g}
    depends_on:
      api:
        condition: service_healthy
  web:
    container_name: pq-dharma-web
    build: ./fe
    environment:
      API_ORIGIN: http://pq-dharma-api:8080
    expose:
      - "3000"
    restart: unless-stopped
    networks: [nginx_network]
    depends_on:
      api:
        condition: service_healthy
volumes:
  audio_uploads:
  speech_models:

networks:
  nginx_network:
    external: true
